<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Medicine</title>
</head>
<body>

    <h1>Medicine Management System</h1>
    <h2>Add Medicine</h2>
    <hr>

    <form>

        <label>Medicine Name:</label><br>
        <input type="text" name="medicine name" placeholder="Enter Medicine Name" required>
        <br><br>

        <label>Company Name :</label><br>
        <input type="text" name="company name" placeholder="Enter Company Name">
        <br><br>

        <label>Category:</label><br>
        <select name="category">
            <option>Select Category</option>
            <option>Fever</option>
            <option>Cold & Cough</option>
            <option>Pain Relief</option>
            <option>Diabetes</option>
            <option>Blood Pressure</option>
            <option>Vitamin</option>
            <option>Antibiotic</option>
            <option>Skin Care</option>
        </select>
        <br><br>

        <label>Manufacturing Date:</label><br>
        <input type="date" name="mfg_date">
        <br><br>

        <label>Expiry Date:</label><br>
        <input type="date" name="exp_date">
        <br><br>

        <label>Price (₹):</label><br>
        <input type="number" name="price" placeholder="Enter Price">
        <br><br>

        <label>Description:</label><br>
        <textarea name="description" rows="4" cols="30" placeholder="Enter Description"></textarea>
        <br><br>

        <label>Quantity:</label><br>
        <input type="number" name="quantity" placeholder="Enter Quantity">
        <br><br>

        <label>Batch Number:</label><br>
        <input type="text" name="batch_no" placeholder="Enter Batch Number">
        <br><br>

        <input type="submit" value="Save Medicine">
        <input type="reset" value="Reset">

        <button type="button" onclick="window.location.href='adminpage.html'">
    Back to Dashboard
</button>

    </form>

</body>
</html>
