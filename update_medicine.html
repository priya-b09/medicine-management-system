<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Medicine</title>
</head>
<body>

<h1>Medicine Management System</h1>
<h2>Update Medicine</h2>
<hr>

<form>


<label>Medicine Name:</label><br>
<input type="text" placeholder="Enter Medicine Name"><br><br>

<label>Company Name:</label><br>
<input type="text" placeholder="Enter Company Name"><br><br>

<label>Category:</label><br>
<select>
    <option>Fever</option>
    <option>Cold & Cough</option>
    <option>Pain Relief</option>
    <option>Allergy</option>
    <option>Diabetes</option>
    <option>Blood Pressure</option>
    <option>Vitamin</option>
    <option>Antibiotic</option>
</select><br><br>

<label>Manufacturing Date:</label><br>
<input type="date"><br><br>

<label>Expiry Date:</label><br>
<input type="date"><br><br>

<label>Price (₹):</label><br>
<input type="number" placeholder="Enter New Price"><br><br>

<label>Quantity:</label><br>
<input type="number" placeholder="Enter New Quantity"><br><br>

<label>Batch Number:</label><br>
<input type="text" placeholder="Enter Batch Number"><br><br>

<label>Description:</label><br>
<textarea rows="4" cols="30" placeholder="Enter Description"></textarea><br><br>

<input type="submit" value="Update Medicine">
<input type="reset" value="Clear">

</form>

<br>

<a href="adminpage.html">
    <button type="button">Back to Dashboard</button>
</a>

</body>
</html>
